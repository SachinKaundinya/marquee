<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stopColor="#161820" />
      <stop offset="1" stopColor="#0A0B0E" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stopColor="rgba(255, 255, 255, 0.28)" />
      <stop offset="1" stopColor="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark sleek chassis -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Anamorphic Lens Cross-axis line -->
  <path d="M12 32H52" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Outer Optic Calibration Ring -->
  <circle cx="32" cy="32" r="23" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- Left Cyan Optical Element -->
  <circle cx="26.5" cy="32" r="10.5" stroke="#00F2FE" stroke-width="3" fill="#00F2FE" fill-opacity="0.16" filter="url(#glow)"/>

  <!-- Right Crimson Optical Element -->
  <circle cx="37.5" cy="32" r="10.5" stroke="#FF2A54" stroke-width="3" fill="#FF2A54" fill-opacity="0.16" filter="url(#glow)"/>

  <!-- Luminous White Center Focal Point -->
  <circle cx="32" cy="32" r="4.2" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
</svg>
