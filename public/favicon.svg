<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E5568"/>
      <stop offset="50%" stop-color="#242833"/>
      <stop offset="100%" stop-color="#14171F"/>
    </linearGradient>
    <linearGradient id="favGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BF8FF"/>
      <stop offset="100%" stop-color="#00AEEF"/>
    </linearGradient>
    <linearGradient id="favMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#E80040"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark base background -->
  <rect width="64" height="64" rx="16" fill="#08090C"/>

  <!-- Oval VR Goggle Visor Frame -->
  <rect x="5" y="14" width="54" height="36" rx="18" fill="#1A1D26" stroke="url(#favBezel)" stroke-width="1.8"/>
  <rect x="7" y="16" width="50" height="32" rx="16" fill="url(#favGlass)" stroke="#050608" stroke-width="1.2"/>

  <!-- Left Lens: Cyan -->
  <circle cx="23" cy="32" r="11" stroke="url(#favCyan)" stroke-width="3" fill="#00E5FF" fill-opacity="0.08" filter="url(#favGlow)"/>
  <circle cx="23" cy="32" r="2" fill="#3BF8FF"/>

  <!-- Right Lens: Magenta -->
  <circle cx="41" cy="32" r="11" stroke="url(#favMagenta)" stroke-width="3" fill="#FF2A55" fill-opacity="0.08" filter="url(#favGlow)"/>
  <circle cx="41" cy="32" r="2" fill="#FF3366"/>

  <!-- Nexus Overlap Core -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" filter="url(#favGlow)"/>
  <circle cx="32" cy="32" r="1.8" fill="#FFFFFF"/>
</svg>
